services:
  db:
    image: postgres:17
    container_name: trigro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: trigro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trigro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: